<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · Rifas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#090a0c;--card:#121418;--line:#262a31;--muted:#969da8;--text:#f5f7fa;--ok:#72d69b;--bad:#ff7777}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{width:min(1100px,calc(100% - 28px));margin:0 auto;padding:28px 0 50px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}h1{font-size:24px;margin:0}.sub{color:var(--muted);margin-top:5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px}.login{max-width:440px;margin:10vh auto}
label{display:block;color:var(--muted);margin:14px 0 7px}input{width:100%;padding:13px 14px;border-radius:13px;border:1px solid var(--line);background:#0c0e11;color:white;outline:none}
button{border:0;border-radius:13px;padding:12px 16px;font-weight:700;cursor:pointer}.primary{width:100%;margin-top:18px;background:white;color:#090a0c}.ghost{background:#1b1e24;color:white;border:1px solid var(--line)}
.msg{margin-top:14px;color:var(--muted)}.bad{color:var(--bad)}.ok{color:var(--ok)}
.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.stat b{font-size:27px;display:block}.stat span{color:var(--muted)}
.list{display:grid;gap:12px}.res{display:grid;grid-template-columns:1.3fr .8fr .8fr;gap:16px;align-items:center}.id{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted);word-break:break-all}.nums{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.num{background:#20242b;border:1px solid #303640;padding:5px 8px;border-radius:9px;font:12px ui-monospace,monospace}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#242830;font-size:12px}.time{color:var(--muted);font-size:13px}
.empty{text-align:center;color:var(--muted);padding:35px}.top-actions{display:flex;gap:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.expiry-live{margin-top:8px;font-size:13px;font-weight:700}
.tabs{display:flex;gap:8px;margin:18px 0 12px}
.tab{background:#15171b;border:1px solid #2a2d33}
.tab.active{background:#f5f7fa;color:#090a0c}
.history-meta{font-size:12px;opacity:.72;margin-top:7px}
.expiry-live.urgent{font-weight:800}
.confirm{background:#f5f7fa;color:#090a0c}
.cancel{background:#27191b;color:#ff9a9a;border:1px solid #543036}
button:disabled{opacity:.5;cursor:not-allowed}
@media(max-width:700px){.stats{grid-template-columns:1fr}.res{grid-template-columns:1fr}.top-actions{flex-direction:column}}

.campaign-box{margin-top:18px;padding:18px}
.campaign-box h2{margin:0 0 4px}
.campaign-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.campaign-grid .full{grid-column:1/-1}
.campaign-box textarea{min-height:100px;resize:vertical}
.campaign-box input,.campaign-box textarea{width:100%;box-sizing:border-box}
.campaign-result{margin-top:10px;font-size:13px}
@media(max-width:700px){.campaign-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <section id="loginView" class="card login">
    <h1>Painel administrativo</h1>
    <div class="sub">Entre com o usuário administrador do Supabase.</div>
    <form id="loginForm">
      <label>E-mail</label><input id="email" type="email" autocomplete="username" required>
      <label>Senha</label><input id="password" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">Entrar</button>
    </form>
    <div id="loginMsg" class="msg"></div>
  </section>

  <main id="adminView" class="hidden">
    <header>
      <div><h1>Reservas</h1><div class="sub">Admin V3.0 · campanhas · atualização automática a cada 15s · próxima em <span id="refreshCountdown">15</span>s</div></div>
      <div class="top-actions"><button id="refresh" class="ghost">Atualizar</button><button id="logout" class="ghost">Sair</button></div>
    </header>
    <div class="stats">
      <div class="card stat"><b id="total">0</b><span>reservas</span></div>
      <div class="card stat"><b id="active">0</b><span>ativas</span></div>
      <div class="card stat"><b id="reservedNums">0</b><span>números reservados</span></div>
    </div>
    <div id="status" class="msg"></div>
    <div class="tabs">
      <button id="tabAtivas" class="tab active">Ativas</button>
      <button id="tabHistorico" class="tab">Histórico</button>
    </div>
    <div id="list" class="list"></div>

    <section class="card campaign-box">
      <h2>Nova campanha</h2>
      <div class="sub">A campanha será criada como rascunho e ainda não aparecerá no site público.</div>
      <form id="campaignForm" class="campaign-grid">
        <div class="full">
          <label>Título</label>
          <input id="campTitulo" type="text" maxlength="120" required placeholder="Ex.: PC Gamer RTX 5070">
        </div>
        <div class="full">
          <label>Descrição</label>
          <textarea id="campDescricao" placeholder="Descrição da campanha"></textarea>
        </div>
        <div class="full">
          <label>URL da imagem</label>
          <input id="campImagem" type="url" placeholder="https://...">
        </div>
        <div>
          <label>Preço por número (R$)</label>
          <input id="campPreco" type="number" min="0" step="0.01" required placeholder="10,00">
        </div>
        <div>
          <label>Quantidade de números</label>
          <input id="campQuantidade" type="number" min="1" max="100000" step="1" required placeholder="100">
        </div>
        <div class="full">
          <button class="primary" type="submit">Criar campanha</button>
          <div id="campaignMsg" class="campaign-result"></div>
        </div>
      </form>
    </section>
  </main>
</div>
<script>
const sb = supabase.createClient("https://fhtlbqvkzmwpengbfmfq.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZodGxicXZrem13cGVuZ2JmbWZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1ODkyNDcsImV4cCI6MjEwNTE2NTI0N30.znctnTWMNCgh4Lrv3DlKevSNLg9aZrMgdGvO6_fOSc0");
const $=id=>document.getElementById(id);
const fmt=d=>new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'short'}).format(new Date(d));

async function verifyAdmin(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user) return false;
  const {data,error}=await sb.from('admins').select('user_id').eq('user_id',user.id).maybeSingle();
  return !error && !!data;
}
async function enter(){
  if(await verifyAdmin()){ $('loginView').classList.add('hidden'); $('adminView').classList.remove('hidden'); await load(); }
  else { await sb.auth.signOut(); $('loginView').classList.remove('hidden'); $('adminView').classList.add('hidden'); }
}
$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault(); $('loginMsg').textContent='Entrando...'; $('loginMsg').className='msg';
  const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
  if(error){$('loginMsg').textContent='Não foi possível entrar: '+error.message;$('loginMsg').className='msg bad';return}
  if(!(await verifyAdmin())){await sb.auth.signOut();$('loginMsg').textContent='Usuário autenticado, mas sem permissão de administrador.';$('loginMsg').className='msg bad';return}
  $('loginMsg').textContent=''; await enter();
});
let carregando=false;
let abaAtual='ativas';
let todasReservasCache=[];
let numerosCache=[];
async function load(){
  if(carregando) return;
  carregando=true;
  $('status').textContent='Limpando reservas expiradas...';
  const limpeza=await sb.rpc('limpar_reservas_expiradas');
  if(limpeza.error){
    $('status').textContent='Erro ao limpar expiradas: '+limpeza.error.message;
    $('status').className='msg bad';
    carregando=false;
    return;
  }
  $('status').textContent='Carregando reservas...';
  const [r,n]=await Promise.all([
    sb.from('reservas').select('id,status,criado_em,expira_em').order('criado_em',{ascending:false}),
    sb.from('numeros').select('numero,status,reserva_id,reservado_ate').not('reserva_id','is',null)
  ]);
  if(r.error||n.error){$('status').textContent='Erro ao carregar: '+(r.error?.message||n.error?.message);$('status').className='msg bad';carregando=false;return}
  todasReservasCache=r.data||[];
  numerosCache=n.data||[];
  const now=Date.now();
  const ativas=todasReservasCache.filter(x=>x.status==='aguardando' && new Date(x.expira_em).getTime()>now);
  $('total').textContent=todasReservasCache.length;
  $('active').textContent=ativas.length;
  $('reservedNums').textContent=numerosCache.filter(x=>x.status==='reservado').length;
  const reservas = abaAtual==='historico'
    ? todasReservasCache.filter(x=>x.status!=='aguardando')
    : ativas;
  $('status').textContent='Conectado ao Supabase · somente leitura'; $('status').className='msg ok';
  if(!reservas.length){
    $('list').innerHTML=`<div class="card empty">${abaAtual==='historico'?'Nenhum registro no histórico.':'Nenhuma reserva ativa.'}</div>`;
    carregando=false; return;
  }
  $('list').innerHTML=reservas.map(x=>{
    const linked=numerosCache.filter(y=>y.reserva_id===x.id).sort((a,b)=>a.numero-b.numero);
    const expired=new Date(x.expira_em).getTime()<=now;
    return `<article class="card res">
      <div><span class="badge">${escapeHtml(x.status)}${expired?' · expirada':''}</span><div class="nums">${linked.length?linked.map(y=>`<span class="num">${String(y.numero).padStart(3,'0')}</span>`).join(''):'<span class="time">Sem números vinculados</span>'}</div>
      ${x.status==='aguardando' && !expired ? `<div class="expiry-live" data-expira="${x.expira_em}">Expira em --:--</div><div class="actions"><button class="confirm" onclick="confirmarPagamento('${x.id}')">✓ Confirmar pagamento</button><button class="cancel" onclick="cancelarReserva('${x.id}')">Cancelar reserva</button></div>` : ''}
      </div>
      <div><div class="time">Criada</div><div>${fmt(x.criado_em)}</div><div class="time" style="margin-top:8px">Expira</div><div>${fmt(x.expira_em)}</div></div>
      <div><div class="time">ID da reserva</div><div class="id">${escapeHtml(x.id)}</div></div>
    </article>`;
  }).join('');
  atualizarContadoresExpiracao();
  carregando=false;
}


function atualizarContadoresExpiracao(){
  const agora=Date.now();
  document.querySelectorAll('.expiry-live').forEach(el=>{
    const fim=new Date(el.dataset.expira).getTime();
    const restante=Math.max(0,Math.floor((fim-agora)/1000));
    const min=Math.floor(restante/60);
    const seg=restante%60;
    el.textContent=`Expira em ${String(min).padStart(2,'0')}:${String(seg).padStart(2,'0')}`;
    el.classList.toggle('urgent', restante<=120);
  });
}
setInterval(atualizarContadoresExpiracao,1000);

async function confirmarPagamento(id){
  if(!confirm('Confirmar o pagamento desta reserva? Os números passarão para VENDIDO.')) return;
  setBusy(true);
  const {data,error}=await sb.rpc('confirmar_pagamento',{p_reserva:id});
  setBusy(false);
  if(error){ alert('Erro: '+error.message); return; }
  if(data!==true){ alert('A reserva não possui números reservados para confirmar.'); await load(); return; }
  await load();
  alert('Pagamento confirmado. Números marcados como VENDIDO.');
}
async function cancelarReserva(id){
  if(!confirm('Cancelar esta reserva? Os números voltarão a ficar DISPONÍVEIS.')) return;
  setBusy(true);
  const {data,error}=await sb.rpc('cancelar_reserva',{p_reserva:id});
  setBusy(false);
  if(error){ alert('Erro: '+error.message); return; }
  if(data!==true){ alert('A reserva não possui números reservados para liberar.'); await load(); return; }
  await load();
  alert('Reserva cancelada e números liberados.');
}
function setBusy(v){
  document.querySelectorAll('button').forEach(b=>b.disabled=v);
}

function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

$('tabAtivas').onclick=async()=>{
  abaAtual='ativas';
  $('tabAtivas').classList.add('active');
  $('tabHistorico').classList.remove('active');
  await load();
};
$('tabHistorico').onclick=async()=>{
  abaAtual='historico';
  $('tabHistorico').classList.add('active');
  $('tabAtivas').classList.remove('active');
  await load();
};

let segundosRefresh=15;
function resetRefreshCountdown(){
  segundosRefresh=15;
  const el=$('refreshCountdown');
  if(el) el.textContent=segundosRefresh;
}
$('refresh').onclick=async()=>{ resetRefreshCountdown(); await load(); };

setInterval(async()=>{
  if($('adminView').classList.contains('hidden')) return;
  segundosRefresh--;
  const el=$('refreshCountdown');
  if(el) el.textContent=Math.max(segundosRefresh,0);
  if(segundosRefresh<=0){
    resetRefreshCountdown();
    await load();
  }
},1000);

$('campaignForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const msg=$('campaignMsg');
  const preco=Number($('campPreco').value);
  const quantidade=Number.parseInt($('campQuantidade').value,10);

  if(!Number.isFinite(preco) || preco<0 || !Number.isInteger(quantidade) || quantidade<1){
    msg.textContent='Confira o preço e a quantidade.';
    msg.className='campaign-result bad';
    return;
  }

  if(!confirm(`Criar a campanha "${$('campTitulo').value.trim()}" como rascunho?`)) return;

  msg.textContent='Criando campanha...';
  msg.className='campaign-result';
  setBusy(true);

  const {data,error}=await sb.rpc('admin_criar_campanha',{
    p_titulo:$('campTitulo').value.trim(),
    p_descricao:$('campDescricao').value.trim(),
    p_imagem_url:$('campImagem').value.trim(),
    p_preco_numero:preco,
    p_quantidade_numeros:quantidade
  });

  setBusy(false);

  if(error){
    msg.textContent='Erro: '+error.message;
    msg.className='campaign-result bad';
    return;
  }

  msg.textContent='Campanha criada como rascunho · ID: '+data;
  msg.className='campaign-result ok';
  $('campaignForm').reset();
});

$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
enter();
</script>
</body>
</html>
